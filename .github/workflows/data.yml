name: data

# Downloads the market-data snapshot on GitHub's runners, which can reach
# Yahoo Finance and Cboe, and commits it under data/. Run it by hand from the
# Actions tab (or `gh workflow run data.yml`) whenever the snapshot should be
# refreshed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python scripts/fetch_data.py
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh market data snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
